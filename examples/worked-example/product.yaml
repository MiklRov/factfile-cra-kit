    '
  object_of_declaration: 'Product with digital elements as identified above, placed on the Union market
    from 1 July 2026.

    '
  conformity_statement: '<NOT ISSUED. This declaration is a draft and must not be signed in its present
    state. Several essential requirements relating to vulnerability handling are recorded as not met in
    the requirements matrix, and the gaps in section 6 are open. A declaration of conformity issued against
    this evidence would be false.>

    '
