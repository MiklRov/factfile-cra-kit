  notified_body_note: 'None involved. On the manufacturer''s reading, the product falls in the default
    category: neither Annex III nor Annex IV lists a product of this kind, and the product''s core function
    is not a security function. The applicable procedure is therefore Module A, internal control of production.
    This reading has not been confirmed by a third party.

    '
  conformity_assessment_module: Module A — internal control of production (Annex VIII, point 1)
  place_of_issue: <to be completed>
  date_of_issue: <not issued>
  signatory_name: <not signed>
  signatory_function: <not signed>
