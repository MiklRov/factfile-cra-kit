name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cra-kit-tests:
    name: cra-kit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
        working-directory: .

      - name: Run pytest
        run: pytest tests/
        working-directory: .
