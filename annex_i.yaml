    notes: ""

  - id: VH-02
    article: "Annex I, Part II, (2)"
    title: "Addressing vulnerabilities without delay"
    requirement: >
      Vulnerabilities are addressed and remediated without delay, including by
      providing security updates. Where a free and open-source component is
      affected, the manufacturer contributes to the upstream fix where feasible.
    applicability: applicable
    annex_vii: 2
    status: not_met   # met | in_progress | not_met | not_applicable
    owner: ""
