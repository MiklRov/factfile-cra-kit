# Essential requirements matrix — Regulation (EU) 2024/2847 (Cyber Resilience Act)
#
# Annex I Part I  — essential cybersecurity requirements for the product (13 items)
# Annex I Part II — vulnerability handling requirements (8 items)
#
# Requirement wording is a condensed restatement, not a verbatim quotation.
# Always check against the official text: https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng
#
# Fields of each requirement:
#   id            — stable identifier referenced from the technical file
#   article       — precise reference to the provision
#   title         — short title
#   requirement   — what is required
#   applicability — applicable | not_applicable | conditional
#                   NOTE: Annex I Part I(2) applies "to the extent applicable"
#                   to the specific product, based on the risk assessment under Art. 13(2).
#                   Non-applicability must be justified, not merely asserted.
#   rationale     — justification where not applicable
#   evidence      — list of evidence items; each: type, ref, note
#                   type: design_doc | test_report | code_ref | config | sbom |
#                         process_doc | third_party | screenshot | policy
#   status        — not_started | in_progress | met | not_met | not_applicable
#   owner         — accountable person
#   annex_vii     — which section of the technical file it feeds
#
# A status of `met` without at least one evidence item is invalid:
# the integrity check in validate.py catches it.

meta:
  regulation: "Regulation (EU) 2024/2847"
  schema_version: "0.1.0"
  product: "<product name>"
  product_version: "<version>"
  assessed_at: "<YYYY-MM-DD>"
  assessor: "<who assessed this>"

part_i:
  - id: EI-01
    article: "Annex I, Part I, (2)(a)"
    title: "No known exploitable vulnerabilities"
    requirement: >
      The product is made available on the market without known exploitable
      vulnerabilities.
    applicability: applicable
    annex_vii: 3
    status: not_met   # met | in_progress | not_met | not_applicable
    owner: ""
    evidence: []
    notes: ""

  - id: EI-02
    article: "Annex I, Part I, (2)(b)"
    title: "Secure by default configuration"
    requirement: >
      The product is made available with a secure by default configuration,
      including the possibility to reset it to its original secure state.
      A different configuration is permitted where agreed with a business user.
    applicability: applicable
    annex_vii: 2
    status: not_met   # met | in_progress | not_met | not_applicable
    owner: ""
    evidence: []
    notes: ""

  - id: EI-03
    article: "Annex I, Part I, (2)(c)"
    title: "Vulnerabilities addressed through security updates"
    requirement: >
