    article: "Annex I, Part II, (1)"
    title: "Identification of components and the SBOM"
    requirement: >
      Components and vulnerabilities of the product are identified and
      documented, including by drawing up a software bill of materials in a
      commonly used machine-readable format covering at the very least the
      top-level dependencies of the product.
    applicability: applicable
    annex_vii: 8
    status: not_met   # met | in_progress | not_met | not_applicable
    owner: ""
