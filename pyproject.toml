[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Not "cra-kit": another project already uses that name.
name = "factfile-cra-kit"
dynamic = ["version"]
description = "Annex VII technical documentation for the EU Cyber Resilience Act, assembled and cross-checked"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Source = "https://github.com/MiklRov/factfile-cra-kit"

[project.scripts]
cra-kit-build = "cra_kit.build:main"
cra-kit-sbom = "cra_kit.sbom_gen:main"
cra-kit-vuln-scan = "cra_kit.vuln_scan:main"
cra-kit-validate = "cra_kit.validate:main"
cra-kit-license-enrich = "cra_kit.license_enrich:main"

[tool.setuptools]
packages = ["cra_kit"]

[tool.setuptools.package-data]
cra_kit = ["doc.css"]

[tool.setuptools.dynamic]
version = { attr = "cra_kit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
